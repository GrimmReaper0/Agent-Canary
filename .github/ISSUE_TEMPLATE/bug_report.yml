name: Bug report
description: Report a reproducible problem in Agent-Canary.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source or sensitive execution reports.
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Include the tool version, Python version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, sanitized inputs, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant errors or report fragments after checking for secrets.
